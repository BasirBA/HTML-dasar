<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Latihan 4 - justify flex </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
   
    <div class="container mt-3">
        <div class="d-flex justify-content-start ">
          <div class="p-2 bg-info">pertama</div>
          <div class="p-2 bg-warning">kedua</div>
          <div class="p-2 bg-primary">ketiga</div>
        </div>
        <div class="d-flex justify-content-end ">
          <div class="p-2 bg-info">keempat</div>
          <div class="p-2 bg-warning">kelima</div>
          <div class="p-2 bg-primary">keenam</div>
        </div>
        <div class="d-flex justify-content-center ">
          <div class="p-2 bg-info">ketujuh</div>
          <div class="p-2 bg-warning">kedelapan</div>
          <div class="p-2 bg-primary">ke sepuluh</div>
        </div>
        <div class="d-flex justify-content-between ">
          <div class="p-2 bg-info">pak camat</div>
          <div class="p-2 bg-warning">tomat</div>
          <div class="p-2 bg-primary">mamat</div>
        </div>
        <div class="d-flex justify-content-around ">
          <div class="p-2 bg-info">doni</div>
          <div class="p-2 bg-warning">chotta beam</div>
          <div class="p-2 bg-primary">paijo</div>
        </div>
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
